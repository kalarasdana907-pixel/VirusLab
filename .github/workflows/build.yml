
name: Build VirusLab APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Extract projects
        run: unzip VirusLab_GitHub_Ready.zip -d source

      - name: Build Agent
        working-directory: source/VirusLabAgent
        run: gradle assembleDebug

      - name: Build Control
        working-directory: source/VirusLabControl
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VirusLab-APKs
          path: |
            source/VirusLabAgent/app/build/outputs/apk/debug/app-debug.apk
            source/VirusLabControl/app/build/outputs/apk/debug/app-debug.apk
            
