name: Build VirusLab APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract projects
        run: unzip -q VirusLab_WebView_AutoBuild.zip -d source

      - name: Build Agent
        working-directory: source/VirusLabAgent
        run: gradle assembleDebug

      - name: Build Control
        working-directory: source/VirusLabControl
        run: gradle assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: VirusLab-APKs
          path: |
            source/VirusLabAgent/app/build/outputs/apk/debug/app-debug.apk
            source/VirusLabControl/app/build/outputs/apk/debug/app-debug.apk
            
            
